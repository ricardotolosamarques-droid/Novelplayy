services:
  - type: web
    name: novelplay-api
    runtime: node
    plan: free
    region: virginia
    rootDir: novelplay_api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        value: Admin
      - key: DATABASE_URL
        fromDatabase:
          name: novelplay-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
