name: Verificar API publicada
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/smoke-novelplay-api.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Testar health do servidor
        run: |
          curl --fail --show-error --silent --max-time 40 --retry 2 --retry-delay 3             https://novelplay-api.onrender.com/health | tee /tmp/health.json
          python3 -c 'import json; data=json.load(open("/tmp/health.json")); assert data["status"] == "ok"'
      - name: Confirmar NovelPlay no navegador
        run: |
          curl --fail --show-error --silent --max-time 40 --retry 2 --retry-delay 3 \
            https://novelplay-api.onrender.com/ -o /tmp/novelplay.html
          grep -q 'Novelinhas no seu navegador' /tmp/novelplay.html
          curl --fail --show-error --silent --max-time 30 \
            https://novelplay-api.onrender.com/manifest.json -o /tmp/manifest.json
          python3 -c 'import json; j=json.load(open("/tmp/manifest.json")); assert j["short_name"] == "NovelPlay"'
          echo "NovelPlay Web disponível e manifesto válido"
      - name: Consultar catálogo e registrar resultado
        run: |
          status=$(curl --silent --show-error --max-time 45 --retry 1             -o /tmp/catalog.json -w '%{http_code}'             https://novelplay-api.onrender.com/api/v1/reelshort/recommended)
          echo "CATALOG_HTTP_STATUS=$status"
          head -c 1200 /tmp/catalog.json || true
          echo
          if [ "$status" != "200" ]; then
            echo "::warning::Servidor online, mas catálogo não está disponível (HTTP $status)"
          fi

      - name: Verificar diretório DramaBos de 42 provedores
        run: |
          curl --fail --show-error --silent --max-time 40 --retry 2 --retry-delay 2 \
            https://novelplay-api.onrender.com/api/dramabos/providers -o /tmp/providers.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/providers.json'))
          names=j.get('providers',[])
          assert len(names)==42, 'Diretório DramaBos incompleto'
          assert len({p['slug'] for p in names})==42
          print('PROVEDORES:',len(names),'CHAVE_CONFIGURADA:',j.get('configured'))
          PY

      - name: Conferir fallback ReelShort usado no seletor de 42 plataformas
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse
          api='https://novelplay-api.onrender.com/api/v1/reelshort'
          def get(path):
              with urllib.request.urlopen(api+path,timeout=45) as response:
                  return json.load(response)
          books=get('/recommended').get('books',[])
          book=next((b for b in books if b.get('book_id') and
                     b.get('filtered_title')),None)
          assert book is not None,'Catálogo ReelShort não forneceu livro válido'
          id=urllib.parse.quote(book['book_id'],safe='')
          slug=urllib.parse.quote(book['filtered_title'],safe='')
          chapters=get('/episodes/'+id+'?filtered_title='+slug)['episodes']
          assert chapters,'ReelShort não retornou episódios'
          free=[ep for ep in chapters if ep.get('free') is True]
          locked=[ep for ep in chapters if ep.get('free') is not True]
          print('FALLBACK_REELSHORT:',len(books),'títulos,',
                len(chapters),'episódios,',len(free),'públicos,',
                len(locked),'indisponíveis')
          if free:
              ep=free[0]
              n=ep['episode']
              code=urllib.parse.quote(ep['chapter_id'],safe='')
              v=get(f'/video/{id}/{n}?filtered_title={slug}&chapter_id={code}')
              assert str(v.get('video_url','')).startswith('https://')
              print('PUBLIC_VIDEO_METADATA: ok')
          PY
