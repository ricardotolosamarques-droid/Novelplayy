name: Gerar NovelPlay v3 (APK)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'novelplay_v3/**'
      - '.github/workflows/novelplay-v3.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Gerar estrutura Android
        working-directory: novelplay_v3
        run: flutter create --org com.example --project-name novelinha_app --platforms android .
      - name: Configurar permissão de internet
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path("novelplay_v3/android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(path)
          root = tree.getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")

          internet = "android.permission.INTERNET"
          if not any(node.get(android + "name") == internet for node in root.findall("uses-permission")):
              permission = ET.Element("uses-permission")
              permission.set(android + "name", internet)
              root.insert(0, permission)

          tree.write(path, encoding="utf-8", xml_declaration=True)
          ET.parse(path)
          print("AndroidManifest.xml válido; anúncios nativos temporariamente desativados.")
          PY
      - name: Configurar compartilhamento de links do Android (1DM)
        working-directory: novelplay_v3
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          kotlin = Path("android/app/src/main/kotlin/com/example/novelinha_app/MainActivity.kt")
          kotlin.parent.mkdir(parents=True, exist_ok=True)
          kotlin.write_text("""package com.example.novelinha_app

          import android.content.Intent
          import android.net.Uri
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val channelName = "novelplay/share"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channelName)
                      .setMethodCallHandler { call, result ->
                          if (call.method == "getInitialSharedText") {
                              val prefs = getSharedPreferences("novelplay_share", MODE_PRIVATE)
                              val pending = prefs.getString("pending", null)
                              prefs.edit().remove("pending").apply()
                              result.success(pending)
                          } else {
                              result.notImplemented()
                          }
                      }
              }
          }

          class ShareReceiverActivity : android.app.Activity() {
              override fun onCreate(savedInstanceState: android.os.Bundle?) {
                  super.onCreate(savedInstanceState)
                  val text = extractSharedText(intent)
                  if (!text.isNullOrBlank()) {
                      val prefs = getSharedPreferences("novelplay_share", MODE_PRIVATE)
                      val old = prefs.getString("pending", "").orEmpty()
                      val combined = listOf(old, text).filter { it.isNotBlank() }.joinToString("\\n")
                      prefs.edit().putString("pending", combined).apply()
                  }
                  finish()
                  overridePendingTransition(0, 0)
              }

              private fun extractSharedText(intent: Intent?): String? {
                  if (intent == null) return null
                  return when (intent.action) {
                      Intent.ACTION_SEND -> intent.getStringExtra(Intent.EXTRA_TEXT)
                          ?: intent.getParcelableExtra<Uri>(Intent.EXTRA_STREAM)?.toString()
                      Intent.ACTION_SEND_MULTIPLE -> {
                          val text = intent.getStringExtra(Intent.EXTRA_TEXT)
                          val uris = intent.getParcelableArrayListExtra<Uri>(Intent.EXTRA_STREAM)
                          (listOfNotNull(text) + (uris ?: arrayListOf()).map { it.toString() })
                              .joinToString("\\n").ifBlank { null }
                      }
                      else -> null
                  }
              }
          }
          """.replace("          ", ""))

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(manifest)
          root = tree.getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          app = root.find("application")
          main = next((a for a in app.findall("activity") if a.get(android + "name", "").endswith("MainActivity")), None)
          if main is None:
              raise SystemExit("MainActivity não encontrada no AndroidManifest")
          main.set(android + "launchMode", "singleTop")
          receiver_name = ".ShareReceiverActivity"
          receiver = next((a for a in app.findall("activity") if a.get(android + "name") == receiver_name), None)
          if receiver is None:
              receiver = ET.SubElement(app, "activity")
          receiver.set(android + "name", receiver_name)
          receiver.set(android + "theme", "@android:style/Theme.Translucent.NoTitleBar")
          receiver.set(android + "exported", "true")
          receiver.set(android + "noHistory", "true")
          receiver.set(android + "excludeFromRecents", "true")
          receiver.set(android + "finishOnTaskLaunch", "true")
          for child in list(receiver.findall("intent-filter")):
              receiver.remove(child)
          for action, mime in [
              ("android.intent.action.SEND", "text/plain"),
              ("android.intent.action.SEND", "video/*"),
              ("android.intent.action.SEND", "application/octet-stream"),
              ("android.intent.action.SEND_MULTIPLE", "video/*"),
          ]:
              filt = ET.SubElement(receiver, "intent-filter")
              ET.SubElement(filt, "action").set(android + "name", action)
              ET.SubElement(filt, "category").set(android + "name", "android.intent.category.DEFAULT")
              ET.SubElement(filt, "data").set(android + "mimeType", mime)
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          ET.parse(manifest)
          print("Compartilhamento em segundo plano configurado com Activity transparente.")
          PY
      - name: Confirmar identificador Android
        working-directory: novelplay_v3/android
        shell: bash
        run: |
          set -euo pipefail
          grep -R -E 'applicationId.*com\.example\.novelinha_app|namespace.*com\.example\.novelinha_app' app
      - name: Corrigir inicialização nativa do AdMob e WorkManager
        working-directory: novelplay_v3
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(manifest)
          root = tree.getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          app = root.find("application")
          if app is None:
              raise SystemExit("AndroidManifest sem elemento application")
          app_id_name = "com.google.android.gms.ads.APPLICATION_ID"
          app_id = next((node for node in app.findall("meta-data")
                         if node.get(android + "name") == app_id_name), None)
          if app_id is None:
              app_id = ET.SubElement(app, "meta-data")
          app_id.set(android + "name", app_id_name)
          # ID oficial de teste do Google; não exibe anúncios comerciais.
          app_id.set(android + "value", "ca-app-pub-3940256099942544~3347511713")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          ET.parse(manifest)

          gradle = Path("android/app/build.gradle.kts")
          if not gradle.exists():
              raise SystemExit("build.gradle.kts não encontrado após flutter create")
          content = gradle.read_text()
          dependency = 'implementation("androidx.work:work-runtime:2.11.2")'
          if dependency not in content:
              content += "\n\ndependencies {\n    " + dependency + "\n}\n"
          gradle.write_text(content)
          print("AdMob App ID de teste configurado e WorkManager fixado em 2.11.2.")
          PY
      - name: Criar keystore de depuração
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_USER_HOME="$HOME/.config/.android"
          mkdir -p "$ANDROID_USER_HOME" "$HOME/.android"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          if [ ! -f "$ANDROID_USER_HOME/debug.keystore" ]; then
            keytool -genkeypair -noprompt -v \
              -keystore "$ANDROID_USER_HOME/debug.keystore" \
              -storepass android \
              -alias AndroidDebugKey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp "$ANDROID_USER_HOME/debug.keystore" "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$ANDROID_USER_HOME/debug.keystore" -storepass android -alias AndroidDebugKey | grep -E 'SHA1:|SHA256:'
          echo "::warning title=Assinatura temporária::Use o SHA-1 e o APK desta mesma execução para o teste OAuth. A chave muda em uma nova execução até configurarmos uma assinatura persistente."
      - name: Instalar pacotes
        working-directory: novelplay_v3
        run: flutter pub get
      - name: Mostrar SHA-1 da assinatura usada no APK
        shell: bash
        run: |
          set -euo pipefail
          keytool -list -v -keystore "$ANDROID_USER_HOME/debug.keystore" -storepass android -alias AndroidDebugKey | grep -E 'SHA1:|SHA256:'
      - name: Compilar APK
        working-directory: novelplay_v3
        env:
          CATALOG_URL: ${{ vars.CATALOG_URL }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          API_INDEX_PATH: ${{ vars.API_INDEX_PATH }}
          API_INFO_PATH: ${{ vars.API_INFO_PATH }}
          API_INFO_ID_PARAM: ${{ vars.API_INFO_ID_PARAM }}
          REELSHORT_API_URL: ${{ vars.REELSHORT_API_URL }}
        run: |
          args=("--dart-define=CATALOG_URL=$CATALOG_URL" "--dart-define=API_BASE_URL=$API_BASE_URL" "--dart-define=DRIVE_API_KEY=${{ secrets.DRIVE_API_KEY }}")
          if [[ -n "$REELSHORT_API_URL" ]]; then args+=("--dart-define=REELSHORT_API_URL=$REELSHORT_API_URL"); fi
          if [[ -n "$API_INDEX_PATH" ]]; then args+=("--dart-define=API_INDEX_PATH=$API_INDEX_PATH"); fi
          if [[ -n "$API_INFO_PATH" ]]; then args+=("--dart-define=API_INFO_PATH=$API_INFO_PATH"); fi
          if [[ -n "$API_INFO_ID_PARAM" ]]; then args+=("--dart-define=API_INFO_ID_PARAM=$API_INFO_ID_PARAM"); fi
          # APK ARM64 compatível com o Galaxy A34; o SHA-1 do mesmo build é exibido acima.
          flutter build apk --release --split-per-abi "${args[@]}"
      - name: Conferir APK ARM64 do Galaxy A34
        run: |
          test -s novelplay_v3/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          ls -lh novelplay_v3/build/app/outputs/flutter-apk/app-*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NovelPlay-Galaxy-A34-arm64
          path: novelplay_v3/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

# Build solicitado: gerar APK atualizado para a importação de links em lote.
