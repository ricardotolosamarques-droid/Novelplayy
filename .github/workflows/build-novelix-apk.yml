name: Build NOVELIX APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "NOVELIX/**"
      - ".github/workflows/build-novelix-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager não encontrado em $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        run: yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK 35 packages
        run: |
          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Gradle wrapper
        working-directory: NOVELIX
        run: gradle wrapper --gradle-version 8.9

      - name: Build debug APK
        working-directory: NOVELIX
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        run: test -s NOVELIX/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVELIX-debug-apk
          path: NOVELIX/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
