name: Build NOVELIX APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "NOVELIX/**"
      - ".github/workflows/build-novelix-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Generate Gradle wrapper
        working-directory: NOVELIX
        run: gradle wrapper --gradle-version 8.9
      - name: Build debug APK
        working-directory: NOVELIX
        run: ./gradlew --no-daemon assembleDebug
      - name: Verify APK
        run: test -s NOVELIX/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVELIX-debug-apk
          path: NOVELIX/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
