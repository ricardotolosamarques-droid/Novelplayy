name: Diagnosticar importação ReelShort PT
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnosticar-episodios.yml'
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Inspecionar página atual ReelShort
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, re
          base='https://www.reelshort.com'
          urls=[
            base+'/pt',
            base+'/pt/full-episodes/bab%C3%A1-para-o-meu-valent%C3%A3o-gostos%C3%A3o-69e9d9c5ae32abe972004769',
            base+'/pt/movie/baba-para-o-meu-valentao-gostosao-69e9d9c5ae32abe972004769'
          ]
          headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36','Accept':'text/html,application/json,*/*','Accept-Language':'pt-BR,pt;q=0.9,en;q=0.8'}
          for url in urls:
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      body=r.read().decode('utf8','replace'); status=r.status
              except urllib.error.HTTPError as e:
                  body=e.read().decode('utf8','replace'); status=e.code
              print('PAGE',url,'STATUS',status,'LEN',len(body),'FINAL_URL',getattr(r,'url',url) if 'r' in locals() else url)
              for pattern in [r'buildId',r'__NEXT_DATA__',r'/_next/static/[^" ]+',r'__next_f',r'online_base',r'chapter_list',r'chapters',r'paid_start',r'chapter_id',r'book_title',r'69e9d9c5ae32abe972004769']:
                  matches=list(re.finditer(pattern,body,re.I))
                  print('PATTERN',pattern,'COUNT',len(matches))
                  for m in matches[:2]:
                      print('CONTEXT',body[max(0,m.start()-250):m.end()+450].replace('\\n',' ')[:800])
              print('HTML_START',body[:500])
          PY
