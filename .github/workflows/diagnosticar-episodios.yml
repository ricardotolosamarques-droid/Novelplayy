name: Diagnosticar importação ReelShort PT
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnosticar-episodios.yml'
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Validar HTML SSR e lista de episódios
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, re, json
          base='https://www.reelshort.com'
          slugs=['baba-para-o-meu-valentao-gostosao-69e9d9c5ae32abe972004769','babá-para-o-meu-valentão-gostosão-69e9d9c5ae32abe972004769']
          headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36','Accept':'text/html,application/json,*/*','Accept-Language':'pt-BR,pt;q=0.9,en;q=0.8'}
          for slug in slugs:
              for route in ['/pt/full-episodes/','/pt/movie/']:
                  url=base+route+urllib.parse.quote(slug,safe='')
                  req=urllib.request.Request(url,headers=headers)
                  try:
                      with urllib.request.urlopen(req,timeout=30) as r: body=r.read().decode('utf8','replace'); status=r.status; final=r.url
                  except urllib.error.HTTPError as e: body=e.read().decode('utf8','replace'); status=e.code; final=url
                  print('PAGE',route,slug[:15],'STATUS',status,'FINAL',final,'LEN',len(body))
                  m=re.search(r'<script[^>]+id="__NEXT_DATA__"[^>]*>(.*?)</script>',body,re.S)
                  print('NEXT_DATA_FOUND',bool(m))
                  if m:
                      data=json.loads(m.group(1))
                      pp=data.get('props',{}).get('pageProps',{})
                      print('PAGEPROPS_KEYS',list(pp.keys()))
                      d=pp.get('data',{})
                      print('DATA_KEYS',list(d.keys())[:50] if isinstance(d,dict) else type(d).__name__)
                      for key in ['chapter_list','online_base','chapters']:
                          arr=d.get(key,[]) if isinstance(d,dict) else []
                          print('EPISODES',key,len(arr),'SAMPLE',arr[:2])
          PY
