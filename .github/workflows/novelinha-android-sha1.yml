name: Preparar Android e obter SHA-1 do Novelinha

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: novelplay_v3
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar estrutura Android com identificador correto
        run: flutter create --platforms=android --org com.example --project-name novelinha_app .

      - name: Confirmar identificador Android
        working-directory: novelplay_v3/android
        shell: bash
        run: |
          set -euo pipefail
          grep -R -E 'applicationId.*com\.example\.novelinha_app|namespace.*com\.example\.novelinha_app' app

      - name: Criar keystore de depuração e conferir SHA-1
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_USER_HOME="$HOME/.config/.android"
          mkdir -p "$ANDROID_USER_HOME" "$HOME/.android"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          if [ ! -f "$ANDROID_USER_HOME/debug.keystore" ]; then
            keytool -genkeypair -noprompt -v \
              -keystore "$ANDROID_USER_HOME/debug.keystore" \
              -storepass android \
              -alias AndroidDebugKey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp "$ANDROID_USER_HOME/debug.keystore" "$HOME/.android/debug.keystore"
          keytool -list -v \
            -keystore "$ANDROID_USER_HOME/debug.keystore" \
            -storepass android \
            -alias AndroidDebugKey | grep -E 'SHA1:|SHA256:'
          echo "::warning title=Assinatura temporária::Este SHA-1 corresponde ao APK desta execução. Para manter o mesmo OAuth em builds futuros, será necessário configurar uma chave de assinatura persistente."

      - name: Instalar dependências
        run: flutter pub get

      - name: Mostrar SHA-1 da assinatura de debug
        working-directory: novelplay_v3/android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:signingReport | tee ../signing-report.txt
          grep -Eq 'SHA1: [0-9A-F:]+' ../signing-report.txt

      - name: Compilar APK de teste
        working-directory: novelplay_v3
        run: flutter build apk --debug --dart-define=DRIVE_API_KEY=${{ secrets.DRIVE_API_KEY }}

      - name: Disponibilizar APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: novelinha-debug-apk
          path: novelplay_v3/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
