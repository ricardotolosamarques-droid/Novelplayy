name: Build NovelPlay APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'novelplay_v3/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        working-directory: novelplay_v3
        run: flutter create --platforms=android --org com.example --project-name novelinha_app .

      - name: Configure Android manifest
        working-directory: novelplay_v3
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('android/app/src/main/AndroidManifest.xml')
          xml = path.read_text()

          internet = '<uses-permission android:name="android.permission.INTERNET" />'
          if internet not in xml:
              manifest_start = xml.find('<manifest')
              manifest_end = xml.find('>', manifest_start)
              if manifest_start < 0 or manifest_end < 0:
                  raise SystemExit('Tag manifest não encontrada no AndroidManifest.xml')
              xml = xml[:manifest_end + 1] + '\\n    ' + internet + xml[manifest_end + 1:]

          app_id = '<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713" />'
          if 'com.google.android.gms.ads.APPLICATION_ID' not in xml:
              app_start = xml.find('<application')
              app_end = xml.find('>', app_start)
              if app_start < 0 or app_end < 0:
                  raise SystemExit('Tag application não encontrada no AndroidManifest.xml')
              xml = xml[:app_end + 1] + '\\n        ' + app_id + xml[app_end + 1:]

          import xml.etree.ElementTree as ET
          ET.fromstring(xml)
          path.write_text(xml)
          print('AndroidManifest.xml válido; permissões e App ID configurados.')
          PY

      - name: Install dependencies
        working-directory: novelplay_v3
        run: flutter pub get

      - name: Check Dart code
        working-directory: novelplay_v3
        run: flutter analyze lib --no-pub --no-fatal-infos

      - name: Build release APK
        working-directory: novelplay_v3
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovelPlay-v3-APK
          path: novelplay_v3/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
