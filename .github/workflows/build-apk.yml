name: Build NovelPlay APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'novelplay_v3/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        working-directory: novelplay_v3
        run: flutter create --platforms=android --org com.example --project-name novelinha_app .

      - name: Enable internet access
        working-directory: novelplay_v3
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in s:
              s = s.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android>\n    ' + permission
              )

          # O SDK do Google Mobile Ads exige um App ID no AndroidManifest.
          # Este é o App ID oficial de teste do Google; não é uma credencial de produção.
          ads_app_id = '<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713" />'
          if 'com.google.android.gms.ads.APPLICATION_ID' not in s:
              s = s.replace('<application', '<application\n        ' + ads_app_id, 1)

          p.write_text(s)
          PY

      - name: Install dependencies
        working-directory: novelplay_v3
        run: flutter pub get

      - name: Check Dart code
        working-directory: novelplay_v3
        run: flutter analyze lib --no-pub --no-fatal-infos

      - name: Build release APK
        working-directory: novelplay_v3
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovelPlay-v3-APK
          path: novelplay_v3/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
