
name: Build NovelPlay APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project
        run: |
          unzip -q novelplay_flutter_v1.zip -d extracted

      - name: Generate Android project
        working-directory: extracted/novelplay_flutter
        run: flutter create --platforms=android --project-name novelplay .

      - name: Enable Internet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('extracted/novelplay_flutter/android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace(
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />'
          )
          p.write_text(s)
          PY

      - name: Install dependencies
        working-directory: extracted/novelplay_flutter
        run: flutter pub get

      - name: Build APK
        working-directory: extracted/novelplay_flutter
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovelPlay-APK
          path: extracted/novelplay_flutter/build/app/outputs/flutter-apk/app-release.apk
