name: Build NovelPlay APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'novelplay_v3/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        working-directory: novelplay_v3
        run: flutter create --platforms=android --org com.example --project-name novelinha_app .

      - name: Add native crash report capture
        working-directory: novelplay_v3
        run: |
          mkdir -p android/app/src/main/kotlin/com/example/novelinha_app
          cat > android/app/src/main/kotlin/com/example/novelinha_app/MainActivity.kt <<'KOTLIN'
          package com.example.novelinha_app

          import android.os.Bundle
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File

          class MainActivity : FlutterActivity() {
              private val channelName = "novelplay/diagnostics"
              private val reportName = "novelplay_last_crash.txt"

              override fun onCreate(savedInstanceState: Bundle?) {
                  val previousHandler = Thread.getDefaultUncaughtExceptionHandler()
                  Thread.setDefaultUncaughtExceptionHandler { thread, error ->
                      try {
                          File(filesDir, reportName).writeText(
                              "FALHA NATIVA CAPTURADA PELO ANDROID\\n" +
                              "Thread: ${thread.name}\\n" +
                              "Tipo: ${error.javaClass.name}\\n" +
                              "Mensagem: ${error.message}\\n\\n" +
                              error.stackTraceToString()
                          )
                      } catch (_: Throwable) {
                      }
                      previousHandler?.uncaughtException(thread, error)
                  }
                  super.onCreate(savedInstanceState)
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channelName)
                      .setMethodCallHandler { call, result ->
                          val report = File(filesDir, reportName)
                          when (call.method) {
                              "getLastCrash" -> result.success(
                                  if (report.exists()) report.readText() else null
                              )
                              "clearLastCrash" -> {
                                  if (report.exists()) report.delete()
                                  result.success(null)
                              }
                              else -> result.notImplemented()
                          }
                      }
              }
          }
          KOTLIN

      - name: Configure Android manifest
        working-directory: novelplay_v3
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('android/app/src/main/AndroidManifest.xml')
          xml = path.read_text()

          internet = '<uses-permission android:name="android.permission.INTERNET" />'
          if internet not in xml:
              manifest_start = xml.find('<manifest')
              manifest_end = xml.find('>', manifest_start)
              if manifest_start < 0 or manifest_end < 0:
                  raise SystemExit('Tag manifest não encontrada no AndroidManifest.xml')
              xml = xml[:manifest_end + 1] + '\\n    ' + internet + xml[manifest_end + 1:]

          import xml.etree.ElementTree as ET
          ET.fromstring(xml)
          path.write_text(xml)
          print('AndroidManifest.xml válido; permissões configuradas.')
          PY

      - name: Install dependencies
        working-directory: novelplay_v3
        run: flutter pub get

      - name: Check Dart code
        working-directory: novelplay_v3
        run: flutter analyze lib --no-pub --no-fatal-infos

      - name: Build release APK
        working-directory: novelplay_v3
        run: flutter build apk --release

      - name: Build diagnostic app with NovelPlay dependencies
        run: |
          flutter create --platforms=android --org com.example --project-name novelplay_full_diagnostic diagnostic_full
          cp novelplay_v3/pubspec.yaml diagnostic_full/pubspec.yaml
          rm -rf diagnostic_full/assets
          cp -a novelplay_v3/assets diagnostic_full/assets
          cat > diagnostic_full/lib/main.dart <<'DART'
          import 'package:flutter/material.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MaterialApp(
              debugShowCheckedModeBanner: false,
              home: Scaffold(
                backgroundColor: Color(0xff101018),
                body: Center(
                  child: Text(
                    'DIAGNÓSTICO COM DEPENDÊNCIAS DO NOVELPLAY OK',
                    textAlign: TextAlign.center,
                    style: TextStyle(color: Colors.white, fontSize: 20),
                  ),
                ),
              ),
            ));
          }
          DART
          cd diagnostic_full
          flutter pub get
          flutter build apk --release

      - name: Upload diagnostic app with NovelPlay dependencies
        uses: actions/upload-artifact@v4
        with:
          name: NovelPlay-Dependencies-Diagnostic
          path: diagnostic_full/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build isolated plugin diagnostic APKs
        run: |
          mkdir -p plugin_isolation
          for plugin in video_player shared_preferences wakelock_plus url_launcher; do
            project="plugin_isolation/${plugin}_test"
            case "$plugin" in
              video_player) version='^2.9.2' ;;
              shared_preferences) version='^2.3.2' ;;
              wakelock_plus) version='^1.3.3' ;;
              url_launcher) version='^6.3.1' ;;
            esac
            flutter create --platforms=android --org com.example --project-name "${plugin}_test" "$project"
            cat > "$project/pubspec.yaml" <<EOF
          name: ${plugin}_test
          publish_to: none
          environment:
            sdk: '>=3.4.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            ${plugin}: ${version}
          flutter:
            uses-material-design: true
          EOF
            cat > "$project/lib/main.dart" <<'DART'
          import 'package:flutter/material.dart';
          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MaterialApp(home: Scaffold(
              body: Center(child: Text('PLUGIN TEST OK')),
            )));
          }
          DART
            (cd "$project" && flutter pub get && flutter build apk --release)
          done

      - name: Upload isolated plugin diagnostic APKs
        uses: actions/upload-artifact@v4
        with:
          name: NovelPlay-Plugin-Isolation-APKs
          path: plugin_isolation/*_test/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build minimal Android diagnostic app
        run: |
          flutter create --platforms=android --org com.example --project-name novelplay_diagnostic diagnostic_app
          cat > diagnostic_app/lib/main.dart <<'DART'
          import 'package:flutter/material.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const DiagnosticApp());
          }

          class DiagnosticApp extends StatelessWidget {
            const DiagnosticApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                home: Scaffold(
                  backgroundColor: const Color(0xff101018),
                  body: Center(
                    child: Padding(
                      padding: const EdgeInsets.all(24),
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: const [
                          Icon(Icons.check_circle, color: Colors.greenAccent, size: 64),
                          SizedBox(height: 20),
                          Text(
                            'TESTE ANDROID OK',
                            style: TextStyle(color: Colors.white, fontSize: 24, fontWeight: FontWeight.bold),
                          ),
                          SizedBox(height: 12),
                          Text(
                            'O Android conseguiu abrir um aplicativo Flutter mínimo. '
                            'Se esta tela aparecer, o problema do NovelPlay está em algum componente ou na inicialização do projeto completo.',
                            textAlign: TextAlign.center,
                            style: TextStyle(color: Colors.white70, fontSize: 16),
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }
          }
          DART
          cd diagnostic_app
          flutter pub get
          flutter build apk --release

      - name: Upload minimal diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: NovelPlay-Android-Diagnostic
          path: diagnostic_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovelPlay-v3-APK
          path: novelplay_v3/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
