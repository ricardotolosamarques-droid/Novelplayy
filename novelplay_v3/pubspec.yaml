    sdk: flutter
  http: ^1.2.2
  video_player: ^2.9.2
  shared_preferences: ^2.3.2
  wakelock_plus: ^1.3.3
  google_mobile_ads: ^9.2.0
  url_launcher: ^6.3.1
flutter:
  uses-material-design: true
  assets:
    - assets/catalog.json
